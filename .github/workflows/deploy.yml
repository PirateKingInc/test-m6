name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html _site/
          [ -f style.css ] && cp style.css _site/ || true
          [ -d src ] && cp -r src _site/ || true
          echo "$GITHUB_SHA" > _site/version.txt
          touch _site/.nojekyll
      - name: Publish to the gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy $GITHUB_SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Ensure Pages serves gh-pages (best effort)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}' | head -c 400 || true
      - name: Poll live URL until HTTP 200 with this commit
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL" || true)
            live=$(curl -s "${SITE_URL}version.txt?nocache=$i" || true)
            echo "attempt $i: $SITE_URL -> $code (live version: ${live:0:12})"
            if [ "$code" = "200" ] && [ "$live" = "$GITHUB_SHA" ]; then exit 0; fi
            sleep 15
          done
          echo "Site never returned 200 for $GITHUB_SHA" >&2
          exit 1
