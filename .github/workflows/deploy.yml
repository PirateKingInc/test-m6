name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html style.css _site/
          cp -r src _site/
          echo "$GITHUB_SHA" > _site/version.txt
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Poll live URL until HTTP 200 with this commit
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s --max-time 10 -o /dev/null -w "%{http_code}" "$SITE_URL" || true)
            live=$(curl -s --max-time 10 "${SITE_URL}version.txt?nocache=$i" || true)
            echo "attempt $i: $SITE_URL -> $code (live version: ${live:0:12})"
            if [ "$code" = "200" ] && [ "$live" = "$GITHUB_SHA" ]; then echo "Live: $SITE_URL"; exit 0; fi
            sleep 15
          done
          echo "Site never returned 200 for $GITHUB_SHA" >&2
          exit 1
