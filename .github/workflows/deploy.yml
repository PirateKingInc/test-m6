name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html _site/
          [ -f style.css ] && cp style.css _site/ || true
          [ -d src ] && cp -r src _site/ || true
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Poll live URL until HTTP 200
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            echo "attempt $i: $URL -> $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "Site never returned 200" >&2
          exit 1
